<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e6c" />
      <stop offset="100%" stop-color="#e63946" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Red Tinted Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#180e10" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="#241316" stroke="url(#redGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Stylized Electric Red 'S' Ribbon -->
  <path d="M 44 20 C 44 14.5 37.5 12 28.5 12 C 19.5 12 16 16.5 16 21.5 C 16 28 24 28.5 35 31.5 C 45 34.5 46.5 41 46.5 45.5 C 46.5 51.5 39 54 28 54 C 17.5 54 13.5 47.5 13.5 42" 
        stroke="url(#redGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
